# SeedVeil messages (UTF-8, MiniMessage). <prefix> is replaced with the prefix below.
# Arguments: <arg:0>, <arg:1>, ... Players see the file matching their client language.
# Apply changes with: /seedveil reload

prefix=<gradient:#F5A623:#F76B1C><bold>SeedVeil</bold></gradient> <dark_gray>»</dark_gray> <gray>

command-blocked=<prefix><#FF5C5C>This command is disabled on this server.

alert.command-probe=<prefix><#FFB74D>⚠ <white><arg:0></white> tried a blocked command <white><arg:2></white> times in the last <white><arg:1></white> seconds (last: <white>/<arg:3></white>).
alert.structure-visits=<prefix><#FFB74D>⚠ <white><arg:0></white> visited <white><arg:2></white> different seed-relevant structures in the last <white><arg:1></white> minutes: <white><arg:3></white>. This may be seed cracking.

status.header=<gradient:#F5A623:#F76B1C><bold>SeedVeil protection status</bold></gradient>
status.hashed-active=<#5CE08A>✔ <white>Hashed seed:</white> <gray>a fake value is sent (<white><arg:0></white> packets rewritten).
status.hashed-disabled=<#FF5C5C>✘ <white>Hashed seed:</white> <gray>disabled in config.yml.
status.hashed-failed=<#FF5C5C>✘ <white>Hashed seed:</white> <gray>could not start, the server version may not be supported (<white><arg:0></white>).
status.datapack-active=<#5CE08A>✔ <white>Bedrock data pack:</white> <gray>enabled (<white><arg:0></white>).
status.datapack-disabled=<#FF5C5C>✘ <white>Bedrock data pack:</white> <gray>disabled in config.yml; the bedrock pattern is vanilla.
status.datapack-missing=<#FF5C5C>✘ <white>Bedrock data pack:</white> <gray>not registered, check the startup log.
status.datapack-incompatible=<#FF5C5C>✘ <white>Bedrock data pack:</white> <gray>incompatible version (<white><arg:0></white>), the generated pack.mcmeta is wrong.
status.datapack-not-enabled=<#FF5C5C>✘ <white>Bedrock data pack:</white> <gray>registered but not enabled (<white><arg:0></white>).
status.files-unreadable=<#FF5C5C>✘ <white>Server config files:</white> <gray>could not be read (<white><arg:0></white>).
status.structures-random=<#5CE08A>✔ <white>Structure seeds (spigot.yml):</white> <gray>all <white><arg:0></white> keys are random.
status.structures-vanilla=<#FF5C5C>✘ <white>Structure seeds (spigot.yml):</white> <gray><white><arg:0></white>/<white><arg:1></white> keys are still vanilla. Run <yellow>/seedveil scramble</yellow><gray>.
status.per-world-seeds=<#FFB74D>⚠ <gray>World-specific seed settings found in spigot.yml: <white><arg:0></white>
status.feature-on=<#5CE08A>✔ <white>Feature seeds (Paper):</white> <gray>on, ore and dungeon placement does not follow the seed.
status.feature-off=<#FF5C5C>✘ <white>Feature seeds (Paper):</white> <gray>off. <yellow>/seedveil scramble</yellow> <gray>turns them on.
status.commands-active=<#5CE08A>✔ <white>Command block:</white> <gray><white><arg:0></white> commands blocked.
status.commands-off=<#FFB74D>• <white>Command block:</white> <gray>off.
status.monitor-active=<#5CE08A>✔ <white>Structure monitor:</white> <gray>on (<white><arg:0></white> structures / <white><arg:1></white> min).
status.monitor-off=<#FFB74D>• <white>Structure monitor:</white> <gray>off.
status.antixray-on=<#5CE08A>✔ <white>Anti-Xray (Paper):</white> <gray>on.
status.antixray-off=<#FFB74D>• <white>Anti-Xray (Paper):</white> <gray>off. Enabling it in config/paper-world-defaults.yml is recommended.
status.geyser-present=<#5CE08A>✔ <white>Geyser:</white> <gray>installed; Bedrock clients never receive the real seed.
status.geyser-absent=<gray>• <white>Geyser:</white> <gray>not installed.
status.world-warning=<#FFB74D>⚠ <gray>The worlds already have <white><arg:0></white> region files. Generation settings only affect new chunks; full protection needs a new world.

scramble.confirm-required=<prefix><#FFB74D>The worlds already have <white><arg:0></white> region files. Existing chunks stay vanilla and structures may be cut off at the borders. To apply anyway: <yellow>/seedveil scramble confirm
scramble.done=<prefix><#5CE08A>✔ <gray><white><arg:0></white> structure seeds randomised, Paper feature seeds turned on. <yellow>Restart the server.</yellow> <gray>For a new world, delete the world folders first.
scramble.failed=<prefix><#FF5C5C>Could not write the server config files, check the console.

busy=<prefix><#FFB74D>Another operation is already running.

reload.done=<prefix><#5CE08A>✔ <gray>Configuration and messages reloaded.
reload.failed=<prefix><#FF5C5C>Reload failed, check the console.
