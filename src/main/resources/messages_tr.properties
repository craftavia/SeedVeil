# SeedVeil Türkçe mesajları (UTF-8, MiniMessage biçimi)
# <prefix> her mesajda aşağıdaki önekle değiştirilir. <arg:0> gibi değerler eklenti tarafından sırayla doldurulur.
# Oyun dili Türkçe olan oyuncular bu dosyayı görür. Değişiklikleri uygulamak için: /seedveil reload

prefix=<gradient:#F5A623:#F76B1C><bold>SeedVeil</bold></gradient> <dark_gray>»</dark_gray> <gray>

command-blocked=<prefix><#FF5C5C>Bu komut bu sunucuda kapalı.

alert.command-probe=<prefix><#FFB74D>⚠ <white><arg:0></white> son <white><arg:1></white> saniyede <white><arg:2></white> kez engellenen komut denedi (son: <white>/<arg:3></white>).
alert.structure-visits=<prefix><#FFB74D>⚠ <white><arg:0></white> son <white><arg:1></white> dakikada <white><arg:2></white> farklı seed yapısı gezdi: <white><arg:3></white>. Seed kırma davranışı olabilir.

status.header=<gradient:#F5A623:#F76B1C><bold>SeedVeil koruma durumu</bold></gradient>
status.hashed-active=<#5CE08A>✔ <white>Hashed seed:</white> <gray>sahte değer gönderiliyor (<white><arg:0></white> paket yeniden yazıldı).
status.hashed-disabled=<#FF5C5C>✘ <white>Hashed seed:</white> <gray>config.yml ile kapatılmış.
status.hashed-failed=<#FF5C5C>✘ <white>Hashed seed:</white> <gray>başlatılamadı, sunucu sürümü desteklenmiyor olabilir (<white><arg:0></white>).
status.datapack-active=<#5CE08A>✔ <white>Bedrock datapack:</white> <gray>etkin (<white><arg:0></white>).
status.datapack-disabled=<#FF5C5C>✘ <white>Bedrock datapack:</white> <gray>config.yml ile kapalı; bedrock deseni vanilla.
status.datapack-missing=<#FF5C5C>✘ <white>Bedrock datapack:</white> <gray>sunucuya tanıtılamadı, açılış logunu kontrol et.
status.datapack-incompatible=<#FF5C5C>✘ <white>Bedrock datapack:</white> <gray>sürüm uyumsuz (<white><arg:0></white>), pack.mcmeta üretimi hatalı.
status.datapack-not-enabled=<#FF5C5C>✘ <white>Bedrock datapack:</white> <gray>tanıtıldı ama etkin değil (<white><arg:0></white>).
status.files-unreadable=<#FF5C5C>✘ <white>Sunucu ayar dosyaları:</white> <gray>okunamadı (<white><arg:0></white>).
status.structures-random=<#5CE08A>✔ <white>Yapı seed'leri (spigot.yml):</white> <gray><white><arg:0></white> anahtarın tamamı rastgele.
status.structures-vanilla=<#FF5C5C>✘ <white>Yapı seed'leri (spigot.yml):</white> <gray><white><arg:0></white>/<white><arg:1></white> anahtar hâlâ vanilla. <yellow>/seedveil scramble</yellow> <gray>çalıştır.
status.per-world-seeds=<#FFB74D>⚠ <gray>spigot.yml içinde dünyaya özel seed ayarı bulundu: <white><arg:0></white>
status.feature-on=<#5CE08A>✔ <white>Feature seed'leri (Paper):</white> <gray>açık, cevher ve dungeon yerleşimi seed'den bağımsız.
status.feature-off=<#FF5C5C>✘ <white>Feature seed'leri (Paper):</white> <gray>kapalı. <yellow>/seedveil scramble</yellow> <gray>açar.
status.commands-active=<#5CE08A>✔ <white>Komut engeli:</white> <gray><white><arg:0></white> komut kapalı.
status.commands-off=<#FFB74D>• <white>Komut engeli:</white> <gray>kapalı.
status.monitor-active=<#5CE08A>✔ <white>Yapı takibi:</white> <gray>açık (<white><arg:0></white> yapı / <white><arg:1></white> dk).
status.monitor-off=<#FFB74D>• <white>Yapı takibi:</white> <gray>kapalı.
status.antixray-on=<#5CE08A>✔ <white>Anti-Xray (Paper):</white> <gray>açık.
status.antixray-off=<#FFB74D>• <white>Anti-Xray (Paper):</white> <gray>kapalı. config/paper-world-defaults.yml içinden açman önerilir.
status.geyser-present=<#5CE08A>✔ <white>Geyser:</white> <gray>kurulu; Bedrock istemcilere gerçek seed gönderilmez.
status.geyser-absent=<gray>• <white>Geyser:</white> <gray>kurulu değil.
status.world-warning=<#FFB74D>⚠ <gray>Dünyalarda <white><arg:0></white> bölge dosyası üretilmiş. Üretim ayarları yalnızca yeni chunk'ları etkiler; tam koruma için yeni dünya gerekir.

scramble.confirm-required=<prefix><#FFB74D>Dünyalarda <white><arg:0></white> bölge dosyası var. Mevcut chunk'lar vanilla kalır, sınırlarda kesik yapılar oluşabilir. Yine de uygulamak için: <yellow>/seedveil scramble confirm
scramble.done=<prefix><#5CE08A>✔ <gray><white><arg:0></white> yapı seed'i rastgele yapıldı, Paper feature seed'leri açıldı. <yellow>Sunucuyu yeniden başlat.</yellow> <gray>Yeni dünya için önce dünya klasörlerini sil.
scramble.failed=<prefix><#FF5C5C>Sunucu ayar dosyaları yazılamadı, konsola bak.

busy=<prefix><#FFB74D>Zaten bir işlem sürüyor.

reload.done=<prefix><#5CE08A>✔ <gray>Ayarlar ve mesajlar yenilendi.
reload.failed=<prefix><#FF5C5C>Yenileme başarısız, konsola bak.
